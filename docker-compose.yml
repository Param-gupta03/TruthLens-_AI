version: '3.8'

services:
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: truthlens-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - truthlens-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthlens-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb+srv://<username>:<password>@cluster0.b0eu6.mongodb.net/truthlens?retryWrites=true&w=majority}
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=http://localhost:3000
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-duckduckgo}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-}
    depends_on:
      - ml-service
    networks:
      - truthlens-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthlens-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - truthlens-net

networks:
  truthlens-net:
    driver: bridge
