services:
  - type: web
    name: truthlens-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: SEARCH_PROVIDER
        value: duckduckgo
      - key: MONGO_URI
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: SEARCH_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
